<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>芯片观察站</title>
<style>
:root{--ink:#10231d;--paper:#f7f8f3;--line:#d7dfd7;--green:#167052;--muted:#617069;--soft:#e7f0e8}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Microsoft YaHei",Arial,sans-serif}main{max-width:1180px;margin:auto;padding:28px 5vw 60px}nav{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:20px}.brand{font:bold 22px Georgia,"Songti SC",serif}.tag{font-size:12px;letter-spacing:1px;color:var(--green);font-weight:700}h1{font:clamp(40px,6vw,76px)/.98 Georgia,"Songti SC",serif;letter-spacing:-2px;margin:24px 0 16px}h1 em{color:var(--green);font-style:normal}.lead{max-width:760px;color:var(--muted);line-height:1.8}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:28px 0}.controls input{border:1px solid var(--line);background:#fff;padding:13px 15px;border-radius:8px;min-width:260px;font:inherit}.controls button,.refresh{border:0;border-radius:8px;background:var(--ink);color:#fff;padding:13px 18px;font-weight:bold;cursor:pointer}.pulse{display:grid;grid-template-columns:1fr 2fr 1fr;gap:24px;align-items:center;background:var(--ink);color:#fff;padding:25px;border-radius:12px;margin:20px 0 34px}.pulse .tag{color:#8fd3ac}.pulse b{font-size:24px}.pulse small{color:#d8e5dc}.layout{display:grid;grid-template-columns:1.06fr .94fr;gap:42px}.head{display:flex;justify-content:space-between;align-items:end;border-bottom:2px solid var(--ink);padding-bottom:12px}.head h2{margin:0}.stock{display:grid;grid-template-columns:1.25fr .8fr .8fr 72px;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:15px 3px;cursor:pointer}.stock:hover,.stock.active{background:var(--soft)}.stock span{color:var(--muted);font-size:12px}.up{color:#058253}.down{color:#ba3640}.news-count{background:#e8f0e9;color:var(--ink);padding:8px;text-align:center;font-size:13px}.news-panel{min-height:480px}.news-panel .empty{color:var(--muted);padding:32px 0;line-height:1.8}.news-item{border-bottom:1px solid var(--line);padding:16px 0}.news-item h3{font:19px/1.45 Georgia,"Songti SC",serif;margin:4px 0 8px}.news-item p,.news-item time{margin:0;color:var(--muted);font-size:12px}.news-item a{font-size:12px;color:var(--green)}.notice{margin-top:24px;padding:16px;background:var(--soft);line-height:1.7;font-size:13px}.empty{padding:26px;color:var(--muted)}@media(max-width:800px){.pulse,.layout{grid-template-columns:1fr}.stock{grid-template-columns:1.25fr .8fr .8fr 58px}.pulse{gap:12px}main{padding:22px 5vw}}
</style>
</head>
<body><main>
<nav><div class="brand">◉ 芯片观察站</div><div class="tag">美股半导体 · 自动更新</div></nav>
<section><p class="tag" style="margin-top:42px">DAILY MARKET BRIEF</p><h1>把市场噪音，<br><em>变成值得看的信号。</em></h1><p class="lead">跟踪美光、AMD、闪迪、海力士、三星、戴尔、日月光、Cerebras、英伟达、台积电与英特尔。点击公司，右侧直接查看中文资讯。</p></section>
<div class="controls"><input id="search" placeholder="搜索公司，例如：英伟达、NVDA、美光"><button id="reset">查看全部</button><button class="refresh" id="refresh">立即更新页面</button></div>
<section class="pulse"><div><p class="tag">MARKET PULSE</p><b id="status">正在读取数据</b></div><div id="summary">后台会自动收集公司新闻、筛选相关内容并生成中文标题。</div><div><small id="updated">尚未取得更新记录</small></div></section>
<section class="layout"><div><div class="head"><h2>核心观察清单</h2><span class="tag">可搜索 · 点公司看新闻</span></div><div id="stocks"></div></div><aside><div class="head"><h2 id="newsTitle">公司中文资讯</h2><span class="tag" id="newsMeta"></span></div><div id="newsPanel" class="news-panel"></div><div class="notice"><b>自动更新方式</b><br>资讯直接显示在本站，不必跳到英文搜索页。标题由后台翻译；“查看原文”仅在你需要核对来源时使用。</div></aside></section>
</main><script>
const companies=[
 ['MU','美光科技'],['AMD','超威半导体'],['SNDK','闪迪'],['000660.KS','SK 海力士'],['005930.KS','三星电子'],['DELL','戴尔科技'],['ASX','日月光 ADR'],['CBRS','Cerebras'],['NVDA','英伟达'],['TSM','台积电 ADR'],['INTC','英特尔'],['GOOGL','谷歌']
];
let daily={companies:{},quotes:{}};let selected='MU';const stocks=document.querySelector('#stocks'),panel=document.querySelector('#newsPanel');
const fmt=n=>typeof n==='number'?n.toFixed(2):'—';
function renderStocks(rows=companies){stocks.innerHTML=rows.length?'':'<div class="empty">没有找到该公司，请换一个名称或代码。</div>';rows.forEach(([ticker,name])=>{const q=daily.quotes?.[ticker]||{},pct=q.changePercent,cls=pct>0?'up':pct<0?'down':'',count=(daily.companies?.[ticker]||[]).length;const el=document.createElement('div');el.className='stock '+(ticker===selected?'active':'');el.innerHTML=`<b>${ticker}<br><span>${name}</span></b><b>${q.price?fmt(q.price):'—'}</b><b class="${cls}">${typeof pct==='number'?`${pct>0?'+':''}${pct.toFixed(2)}%`:'待更新'}</b><span class="news-count">${count} 条资讯</span>`;el.onclick=()=>{selected=ticker;renderStocks(filtered());renderNews()};stocks.append(el)})}
function renderNews(){const name=(companies.find(x=>x[0]===selected)||[])[1]||selected,items=daily.companies?.[selected]||[];document.querySelector('#newsTitle').textContent=name+' · 中文资讯';document.querySelector('#newsMeta').textContent=items.length?`${items.length} 条`:'暂无';if(!items.length){panel.innerHTML='<div class="empty">暂时没有足够相关的新闻。后台下次自动更新时会重新收集。</div>';return}panel.innerHTML=items.map(x=>`<article class="news-item"><p>${x.source||'资讯来源'} · <time>${formatTime(x.time)}</time></p><h3>${escapeHtml(x.title_zh||x.title||'未命名资讯')}</h3>${x.title_zh&&x.title&&x.title_zh!==x.title?`<p>英文原题：${escapeHtml(x.title)}</p>`:''}<p style="margin-top:8px"><a href="${x.url}" target="_blank" rel="noopener">查看原文 ↗</a></p></article>`).join('')}
function formatTime(v){if(!v)return '';if(/^\d{8}T\d{6}/.test(v))return v.slice(0,4)+'-'+v.slice(4,6)+'-'+v.slice(6,8)+' '+v.slice(9,11)+':'+v.slice(11,13);return String(v).replace('T',' ').slice(0,16)}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function filtered(){const x=document.querySelector('#search').value.trim().toLowerCase();return companies.filter(r=>r.join(' ').toLowerCase().includes(x))}
document.querySelector('#search').oninput=()=>renderStocks(filtered());document.querySelector('#reset').onclick=()=>{document.querySelector('#search').value='';renderStocks()};
async function load(){try{const r=await fetch('data/daily.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error();daily=await r.json();const time=new Date(daily.updated_at);document.querySelector('#status').textContent='资讯已自动更新';document.querySelector('#summary').textContent='点击左侧公司，可直接查看后台筛选并翻译的相关中文资讯。行情为最近一次后台采集的公开报价。';document.querySelector('#updated').textContent='最后更新：'+time.toLocaleString('zh-CN');renderStocks();renderNews()}catch(e){document.querySelector('#status').textContent='等待自动数据';document.querySelector('#summary').textContent='后台数据暂时不可用，请稍后自动重试。';renderStocks();renderNews()}}
document.querySelector('#refresh').onclick=load;load();setInterval(load,300000);
</script></body></html>
