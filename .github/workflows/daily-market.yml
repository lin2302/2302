name: Daily market update
on:
  schedule:
    - cron: '30 21 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect market and company news
        env:
          API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        run: |
          mkdir -p data
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          key=os.environ['API_KEY']; tickers=['MU','AMD','SNDK','DELL','ASX','NVDA','TSM','INTC','GOOGL']
          out={'updated_at':__import__('datetime').datetime.utcnow().isoformat()+'Z','companies':{}}
          for t in tickers:
            u='https://www.alphavantage.co/query?'+urllib.parse.urlencode({'function':'NEWS_SENTIMENT','tickers':t,'limit':8,'apikey':key})
            try:
              d=json.load(urllib.request.urlopen(u,timeout=30)); out['companies'][t]=[{'title':x.get('title'),'url':x.get('url'),'time':x.get('time_published'),'source':x.get('source')} for x in d.get('feed',[])]
            except Exception as e: out['companies'][t]=[]
          json.dump(out,open('data/daily.json','w'),ensure_ascii=False,indent=2)
          PY
      - run: |
          git config user.name 'chip-watch-bot'
          git config user.email 'actions@github.com'
          git add data/daily.json
          git diff --cached --quiet || git commit -m 'chore: daily market update'
          git push
